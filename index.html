<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Life Simulator">
<meta name="theme-color" content="#090b13">
<title>Life Simulator</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{--a1:#8fe3c8;--a2:#3ba3ff;--ar:90,170,255;--bg:#090b13;--card:rgba(255,255,255,.05);--card2:rgba(255,255,255,.09);--line:rgba(255,255,255,.08);
--t1:#fff;--t2:rgba(255,255,255,.64);--t3:rgba(255,255,255,.4);--red:#ff453a;--green:#30d158;--blue:#0a84ff;--teal:#2dd4bf;--yel:#ffd60a;
--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--tab:64px;--top:148px;
--font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--t1);font-family:var(--font);overflow:hidden;overscroll-behavior:none}
body{-webkit-font-smoothing:antialiased;touch-action:manipulation;-webkit-user-select:none;user-select:none}
input{-webkit-user-select:text;user-select:text;font:inherit;font-size:16px;color:var(--t1)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.num,b,.st b{font-variant-numeric:tabular-nums}
.grad{background:linear-gradient(135deg,var(--a1),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent}
.g{color:var(--green)}.r{color:var(--red)}.o{color:var(--a1)}.mut{color:var(--t3)}.t2{color:var(--t2)}

#bg{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none}
#bg i{position:absolute;border-radius:50%;filter:blur(80px);opacity:.16;animation:drift 26s ease-in-out infinite alternate}
#bg i:nth-child(1){width:380px;height:380px;background:#3ba3ff;top:-150px;left:-130px}
#bg i:nth-child(2){width:320px;height:320px;background:#b06bff;top:46%;right:-170px;opacity:.14;animation-duration:32s}
@keyframes drift{to{transform:translate(50px,70px) scale(1.12)}}

/* top HUD */
#top{position:fixed;left:0;right:0;top:0;z-index:6;padding:calc(var(--st) + 8px) 14px 10px;background:rgba(9,11,16,.78);
 backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);border-bottom:1px solid var(--line)}
.t1{display:flex;align-items:center;justify-content:space-between;gap:10px;height:34px}
#meBtn{display:flex;flex-direction:column;align-items:flex-start;min-width:0;text-align:left}
#meBtn b{font-size:17px;font-weight:800;letter-spacing:-.01em;display:flex;align-items:center;gap:5px;white-space:nowrap}
#meBtn b svg{width:13px;height:13px;opacity:.5}
#sub{font-size:12.5px;color:var(--t2);font-weight:600;white-space:nowrap}
.spd{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:2px;flex:none}
.spd button{width:40px;height:30px;border-radius:10px;font-size:13px;font-weight:800;color:var(--t2);display:grid;place-items:center;transition:all .2s}
.spd button svg{width:14px;height:14px}
.spd button.on{background:linear-gradient(135deg,var(--a1),var(--a2));color:#111}
.t2r{display:grid;grid-template-columns:1.25fr 1fr 1fr 1fr;gap:6px;margin-top:8px}
.st{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:5px 8px;min-width:0}
.st i{display:block;font-style:normal;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--t3)}
.st b{display:block;font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .3s}
.st b.flash{animation:fl .6s}
@keyframes fl{30%{transform:scale(1.08)}}

/* pages */
#app{position:fixed;inset:0;z-index:1}
.page{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(var(--st) + var(--top) + 12px) 14px calc(var(--tab) + var(--sb) + 30px);
 opacity:0;pointer-events:none;transform:translateY(8px);transition:opacity .25s ease,transform .35s cubic-bezier(.2,.8,.2,1)}
.page.on{opacity:1;pointer-events:auto;transform:none}
.page::-webkit-scrollbar{display:none}
.hdr{display:flex;align-items:flex-end;justify-content:space-between;margin:4px 2px 14px;gap:12px}
.hdr h1{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.hdr .s{font-size:13.5px;color:var(--t2);margin-top:3px}
.ibtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--card2);flex:none;transition:transform .15s}
.ibtn:active{transform:scale(.9)}
.ibtn svg{width:19px;height:19px}

.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:12px;position:relative;overflow:hidden;
 backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.card h3{font-size:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--t3);margin-bottom:11px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h3 span{text-transform:none;letter-spacing:0;font-weight:600;font-size:13px;color:var(--t2)}
.lux{background:linear-gradient(160deg,rgba(var(--ar),.15),rgba(255,255,255,.03) 50%,rgba(255,255,255,.04));border-color:rgba(var(--ar),.22)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:50px;border-radius:15px;font-weight:800;font-size:16.5px;width:100%;
 background:linear-gradient(135deg,var(--a1),var(--a2));color:#111;transition:transform .15s,opacity .2s;box-shadow:0 10px 28px -12px rgba(var(--ar),.6)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--card2);color:var(--t1);box-shadow:none}
.btn.danger{background:rgba(255,69,58,.15);color:var(--red);box-shadow:none}
.btn:disabled{opacity:.38}
.btn+.btn{margin-top:10px}
.mb{height:34px;min-width:44px;padding:0 10px;border-radius:11px;background:var(--card2);font-size:14px;font-weight:800;transition:transform .12s,opacity .2s;white-space:nowrap}
.mb:active{transform:scale(.92)}
.mb.p{background:linear-gradient(135deg,var(--a1),var(--a2));color:#111}
.mb.t{background:rgba(45,212,191,.16);color:var(--teal)}
.mb.d{background:rgba(255,69,58,.14);color:#ff7b73}
.mb:disabled{opacity:.3}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:3px}
.seg button{flex:1;min-height:36px;border-radius:10px;font-size:13px;font-weight:700;color:var(--t2);transition:all .2s;line-height:1.15;padding:3px 2px}
.seg button small{display:block;font-size:10.5px;font-weight:600;opacity:.7}
.seg button.on{background:var(--card2);color:var(--t1);box-shadow:0 2px 8px rgba(0,0,0,.4)}
.kv{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:14.5px;gap:10px}
.kv:first-of-type{border-top:0}
.kv span{color:var(--t2)}
.kv b{font-weight:700;text-align:right}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:999px;font-size:11.5px;font-weight:800;background:var(--card2);color:var(--t2);white-space:nowrap}
.pill.o{background:rgba(var(--ar),.16);color:var(--a1)}
.pill.r{background:rgba(255,69,58,.16);color:#ff7b73}
.pill.g{background:rgba(48,209,88,.15);color:var(--green)}
.pill.t{background:rgba(45,212,191,.15);color:var(--teal)}
.tgl{width:51px;height:31px;border-radius:16px;background:rgba(255,255,255,.16);position:relative;flex:none;transition:background .25s}
.tgl:after{content:"";position:absolute;left:2px;top:2px;width:27px;height:27px;border-radius:50%;background:#fff;transition:transform .25s cubic-bezier(.3,1.4,.5,1);box-shadow:0 2px 6px rgba(0,0,0,.4)}
.tgl.on{background:var(--green)}
.tgl.on:after{transform:translateX(20px)}
.set{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.set:first-of-type{border-top:0}
.set div b{display:block;font-size:15.5px;font-weight:700}
.set div small{display:block;font-size:12.5px;color:var(--t3);margin-top:2px;line-height:1.35}

/* floor */
#season{display:flex;align-items:center;gap:10px;margin-bottom:10px;padding:10px 14px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
#season.hot{background:linear-gradient(120deg,rgba(255,69,58,.22),rgba(var(--ar),.14));border-color:rgba(255,120,60,.35)}
#season.warm{background:linear-gradient(120deg,rgba(var(--ar),.16),rgba(255,255,255,.03));border-color:rgba(var(--ar),.25)}
#season.cool{background:linear-gradient(120deg,rgba(10,132,255,.16),rgba(255,255,255,.03));border-color:rgba(10,132,255,.25)}
#season .ic{font-size:24px}
#season b{display:block;font-size:15px;font-weight:800}
#season small{display:block;font-size:12.5px;color:var(--t2);margin-top:1px}
#season .mx{margin-left:auto;font-size:20px;font-weight:900}
.cvw{border-radius:22px;overflow:hidden;border:1px solid rgba(255,255,255,.1);background:#0d1016;position:relative;box-shadow:0 20px 40px -20px rgba(0,0,0,.9)}
#cv{display:block;width:100%}
.legend{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;font-size:11.5px;color:var(--t3);margin:9px 0 12px;font-weight:600}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.pl{display:grid;grid-template-columns:30px 1fr auto;gap:4px 10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.pl:first-of-type{border-top:0;padding-top:2px}
.pl .e{font-size:20px;grid-row:span 2;text-align:center}
.pl b{font-size:14.5px;font-weight:700}
.pl .v{font-size:12.5px;color:var(--t2);text-align:right;white-space:nowrap}
.pl .bar{grid-column:2/4}
.pl .q{grid-column:2/4;font-size:12px;color:var(--t3);margin-top:1px}
.tip{display:flex;gap:11px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line);font-size:14px;line-height:1.4;color:var(--t2)}
.tip:first-of-type{border-top:0;padding-top:0}
.tip em{font-style:normal;font-size:18px;line-height:1.1}
.tip b{color:var(--t1)}
.news{font-size:13px;line-height:1.4;color:var(--t2);padding:7px 0;border-top:1px solid var(--line);display:flex;gap:10px}
.news:first-of-type{border-top:0;padding-top:0}
.news time{color:var(--t3);font-size:11.5px;font-weight:700;flex:none;width:58px;padding-top:1px}
.news.bad{color:#ffa29c}.news.good{color:#8fe3a9}
.g4{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g4>.btn{margin-top:0}
.mini{background:rgba(255,255,255,.04);border-radius:14px;padding:10px 12px}
.mini i{display:block;font-style:normal;font-size:11px;color:var(--t3);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.mini b{font-size:19px;font-weight:800;display:block;margin-top:2px}

/* team / build */
.dc .top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.dc .top .e{width:44px;height:44px;border-radius:14px;background:var(--card2);display:grid;place-items:center;font-size:23px;flex:none}
.dc .top b{font-size:18px;font-weight:800;display:block}
.dc .top small{font-size:12.5px;color:var(--t2)}
.dc .top .pill{margin-left:auto}
.hr{display:flex;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--line)}
.hr .l{flex:1;min-width:0}
.hr .l b{font-size:15px;font-weight:700;display:block}
.hr .l small{font-size:12px;color:var(--t3);display:block;margin-top:1px}
.need{margin-top:6px;font-size:12.5px;color:var(--t2);display:flex;justify-content:space-between;gap:8px;margin-bottom:6px}
.wg{display:flex;align-items:center;gap:10px}
.wg b{font-size:22px;font-weight:800;min-width:74px;text-align:center}
.up{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.up:first-of-type{border-top:0;padding-top:2px}
.up .e{width:42px;height:42px;border-radius:13px;background:var(--card2);display:grid;place-items:center;font-size:21px;flex:none}
.up .l{flex:1;min-width:0}
.up .l b{display:block;font-size:15px;font-weight:700}
.up .l small{display:block;font-size:12.5px;color:var(--t3);margin-top:2px;line-height:1.35}
.up.own .e{background:rgba(48,209,88,.14)}
.lvl{display:flex;gap:6px;margin:12px 0}
.lvl i{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.1)}
.lvl i.on{background:linear-gradient(90deg,var(--a2),var(--a1))}

/* charts */
.ch{width:100%;height:140px;display:block}
.lg{display:flex;gap:12px;font-size:11.5px;color:var(--t3);font-weight:700;margin-top:6px}
.lg i{display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:5px;vertical-align:3px}

/* goals */
.gl{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.gl:first-of-type{border-top:0;padding-top:2px}
.gl .e{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:19px;background:var(--card2);flex:none}
.gl.done .e{background:rgba(var(--ar),.2);box-shadow:0 0 0 2px rgba(var(--ar),.5);animation:pulse 1.6s infinite}
.gl.cl .e{background:rgba(48,209,88,.15)}
.gl.cl .l b{color:var(--t2)}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(var(--ar),.12)}}
.gl .l{flex:1;min-width:0}
.gl .l b{display:block;font-size:14.5px;font-weight:700;line-height:1.3}
.gl .l small{display:block;font-size:12.5px;color:var(--t3);margin-top:3px}
.gl .bar{margin-top:6px;height:5px}
.cal{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.cal:first-of-type{border-top:0;padding-top:0}
.cal .d{width:46px;text-align:center;flex:none;background:var(--card2);border-radius:12px;padding:5px 0}
.cal .d b{display:block;font-size:17px;font-weight:800;line-height:1.1}
.cal .d small{font-size:10.5px;color:var(--t3);font-weight:700;text-transform:uppercase}
.cal .l{flex:1}
.cal .l b{font-size:14.5px;display:block}
.cal .l small{font-size:12.5px;color:var(--t3)}
.badge{position:absolute;top:7px;left:calc(50% + 7px);min-width:17px;height:17px;border-radius:9px;background:var(--red);color:#fff;font-size:10.5px;font-weight:800;display:grid;place-items:center;padding:0 4px}

/* tabs */
#tabs{position:fixed;left:12px;right:12px;bottom:calc(var(--sb) + 8px);height:var(--tab);z-index:5;display:flex;border-radius:24px;
 background:rgba(18,20,26,.78);border:1px solid rgba(255,255,255,.09);backdrop-filter:blur(28px) saturate(1.8);-webkit-backdrop-filter:blur(28px) saturate(1.8);box-shadow:0 20px 40px -12px rgba(0,0,0,.8)}
#tabs button{flex:1;display:grid;justify-items:center;align-content:center;gap:4px;font-size:10.5px;font-weight:700;color:var(--t3);transition:color .2s;position:relative}
#tabs svg{width:24px;height:24px;transition:transform .25s}
#tabs button.on{color:var(--a1)}
#tabs button.on svg{transform:translateY(-1px) scale(1.08)}

/* sheet, modal, toast */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:10;opacity:0;pointer-events:none;transition:opacity .3s}
#scrim.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:11;max-height:90%;overflow-y:auto;border-radius:28px 28px 0 0;background:#12141a;
 border-top:1px solid rgba(255,255,255,.1);padding:6px 18px calc(var(--sb) + 22px);transform:translateY(105%);transition:transform .42s cubic-bezier(.2,.9,.2,1)}
#sheet.on{transform:none}
#sheet.drag{transition:none}
#sheet::-webkit-scrollbar{display:none}
#sheet .card{background:rgba(255,255,255,.04)}
.grab{height:26px;display:grid;place-items:center;margin:0 -18px}
.grab:before{content:"";width:40px;height:5px;border-radius:3px;background:rgba(255,255,255,.22)}
.sh-t{font-size:22px;font-weight:800;margin:2px 0 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
#modal{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:20px;background:rgba(0,0,0,.62);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
 opacity:0;pointer-events:none;transition:opacity .25s}
#modal.on{opacity:1;pointer-events:auto}
.mc{width:100%;max-width:370px;max-height:86vh;overflow-y:auto;background:#14161c;border:1px solid rgba(255,255,255,.1);border-radius:28px;padding:24px 20px 20px;text-align:center;
 transform:scale(.92) translateY(10px);transition:transform .35s cubic-bezier(.2,1.3,.4,1);box-shadow:0 30px 80px -20px rgba(0,0,0,.9)}
#modal.on .mc{transform:none}
.mc .big{font-size:52px;line-height:1;margin-bottom:12px}
.mc h2{font-size:22px;font-weight:800;letter-spacing:-.01em;margin-bottom:8px}
.mc p{font-size:15px;color:var(--t2);line-height:1.45;margin-bottom:18px}
.mc .kv{text-align:left}
.mc .btn{margin-top:10px}
.dots{display:flex;gap:6px;justify-content:center;margin:4px 0 14px}
.dots i{width:7px;height:7px;border-radius:4px;background:rgba(255,255,255,.18);transition:all .3s}
.dots i.on{width:20px;background:var(--a1)}
.flow{display:flex;align-items:center;justify-content:center;gap:4px;margin:4px 0 16px;font-size:12px;font-weight:700;color:var(--t2)}
.flow span{background:var(--card2);border-radius:10px;padding:7px 6px;display:grid;gap:2px;justify-items:center}
.flow span em{font-style:normal;font-size:20px}
#toast{position:fixed;left:50%;bottom:calc(var(--sb) + var(--tab) + 18px);transform:translate(-50%,60px);opacity:0;pointer-events:none;z-index:15;background:rgba(32,34,40,.95);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
 border:1px solid rgba(255,255,255,.12);padding:11px 14px;border-radius:16px;font-size:14px;font-weight:600;display:flex;gap:12px;align-items:center;transition:transform .4s cubic-bezier(.2,1.2,.3,1),opacity .25s;width:max-content;max-width:92%;line-height:1.35}
#toast.on{transform:translate(-50%,0);opacity:1;pointer-events:auto}
#toast.bad{border-color:rgba(255,69,58,.45);background:rgba(52,24,24,.95)}
#toast.good{border-color:rgba(48,209,88,.4);background:rgba(20,44,28,.95)}
#toast button{color:var(--a1);font-weight:800;flex:none}
#dayBan{position:fixed;left:12px;right:12px;top:calc(var(--st) + var(--top) + 8px);z-index:7;border-radius:18px;padding:11px 14px;background:rgba(24,27,34,.95);
 border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);transform:translateY(-30px);opacity:0;pointer-events:none;transition:all .4s cubic-bezier(.2,1.1,.3,1);box-shadow:0 16px 30px -10px rgba(0,0,0,.8)}
#dayBan.on{transform:none;opacity:1;pointer-events:auto}
#dayBan .h{display:flex;justify-content:space-between;font-size:12px;font-weight:800;color:var(--t3);text-transform:uppercase;letter-spacing:.06em}
#dayBan .b{display:flex;gap:14px;margin-top:5px;font-size:14px;font-weight:700}
#dayBan .b span{color:var(--t3);font-weight:600;font-size:11.5px;display:block}
#fxc{position:fixed;inset:0;z-index:35;pointer-events:none}
#hap{position:fixed;left:-200px;top:0;opacity:0;pointer-events:none}

/* onboarding */
#ob{position:fixed;inset:0;z-index:30;background:radial-gradient(ellipse at 50% 20%,#2a1a06,#07090d 60%);display:flex;flex-direction:column;justify-content:center;
 padding:calc(var(--st) + 30px) 26px calc(var(--sb) + 30px);transition:opacity .45s,transform .45s}
#ob.out{opacity:0;transform:scale(1.04);pointer-events:none}
#ob .logo{width:96px;height:96px;border-radius:26px;margin:0 auto 22px;box-shadow:0 20px 60px -10px rgba(var(--ar),.55);display:block}
#ob h1{text-align:center;font-size:38px;font-weight:900;letter-spacing:-.03em}
#ob p{text-align:center;color:var(--t2);font-size:16px;line-height:1.45;margin:10px 0 28px}
#ob label{font-size:13px;font-weight:700;color:var(--t3);margin:0 2px 8px;display:block}
.inp{width:100%;height:54px;border-radius:15px;background:rgba(255,255,255,.07);border:1px solid var(--line);padding:0 16px;outline:none;font-size:18px;font-weight:700;letter-spacing:.04em}
.inp:focus{border-color:rgba(var(--ar),.6)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 26px}
.chip{padding:8px 13px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:14px;font-weight:700;color:var(--t2)}
.chip.on{background:rgba(var(--ar),.16);border-color:rgba(var(--ar),.5);color:var(--a1)}
/* ===== life simulator specific ===== */
.t2r{grid-template-columns:repeat(4,1fr)}
.bars{display:grid;gap:7px;margin-top:9px}
.bar{display:grid;grid-template-columns:62px 1fr 34px;align-items:center;gap:8px}
.bar i{font-style:normal;font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--t3)}
.bar u{display:block;height:7px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden;text-decoration:none}
.bar u s{display:block;height:100%;border-radius:99px;transition:width .5s cubic-bezier(.2,.9,.2,1)}
.bar b{font-size:12.5px;font-weight:800;text-align:right;color:var(--t2)}
#actRow{position:fixed;left:14px;right:14px;bottom:calc(var(--sb) + var(--tab) + 12px);z-index:8;display:flex;gap:9px;transition:opacity .3s,transform .3s}
#actRow.hide{opacity:0;pointer-events:none;transform:translateY(14px)}
#doBtn{width:66px;flex:none;height:56px;border-radius:18px;background:var(--card2);border:1px solid var(--line);display:grid;place-items:center;
 backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);transition:transform .15s}
#doBtn:active{transform:scale(.95)}
#doBtn em{font-style:normal;font-size:19px;display:block;line-height:1}
#doBtn small{display:block;font-size:10.5px;font-weight:800;color:var(--t3);margin-top:2px;letter-spacing:.04em}
#ageBtn{flex:1;height:56px;border-radius:18px;
 background:linear-gradient(135deg,var(--a1),var(--a2));color:#06121c;font-size:18px;font-weight:900;display:flex;align-items:center;justify-content:center;gap:9px;
 box-shadow:0 14px 34px -8px rgba(var(--ar),.6);transition:transform .15s,opacity .3s}
#ageBtn:active{transform:scale(.97)}

#ageBtn small{font-size:12.5px;font-weight:700;opacity:.65}
.page.feedpad{padding-bottom:calc(var(--tab) + var(--sb) + 96px)}
/* timeline */
.yr{display:flex;align-items:center;gap:9px;margin:16px 2px 9px}
.yr b{font-size:13px;font-weight:900;letter-spacing:.02em;background:var(--card2);padding:4px 10px;border-radius:99px}
.yr span{flex:1;height:1px;background:var(--line)}
.ev{display:flex;gap:11px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:17px;padding:12px 13px;margin-bottom:8px;animation:pop .35s both}
@keyframes pop{from{opacity:0;transform:translateY(8px)}}
.ev em{font-style:normal;font-size:20px;line-height:1.1;flex:none}
.ev p{font-size:14.5px;line-height:1.42;color:var(--t1)}
.ev.good{border-color:rgba(48,209,88,.3);background:rgba(20,44,28,.4)}
.ev.bad{border-color:rgba(255,69,58,.26);background:rgba(44,20,22,.4)}
.ev.big{border-color:rgba(var(--ar),.4);background:linear-gradient(135deg,rgba(var(--ar),.16),rgba(255,255,255,.03))}
.ev.end{border-color:rgba(255,255,255,.3);background:rgba(255,255,255,.07)}
.ev.q{background:transparent;border-style:dashed;border-color:rgba(255,255,255,.14)}
.ev.q p{color:var(--t2);font-weight:600}
/* person rows */
.pr{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.pr:first-of-type{border-top:0}
.pr .av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:21px;background:var(--card2);flex:none}
.pr .nm{flex:1;min-width:0}
.pr .nm b{display:block;font-size:15.5px;font-weight:700}
.pr .nm small{display:block;font-size:12px;color:var(--t3);margin-top:1px}
.pr .bd{width:70px;flex:none}
.pr .bd u{display:block;height:6px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden;text-decoration:none}
.pr .bd u s{display:block;height:100%;background:linear-gradient(90deg,#ff7a9c,#ff4d79)}
.pr .bd small{display:block;font-size:10.5px;color:var(--t3);margin-top:3px;text-align:right}
.dead{opacity:.45}
.jb{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.jb:first-of-type{border-top:0}
.jb em{font-style:normal;font-size:22px;flex:none}
.jb .nm{flex:1;min-width:0}
.jb .nm b{display:block;font-size:15px;font-weight:700}
.jb .nm small{display:block;font-size:12px;color:var(--t3);margin-top:1px}
.pill{background:var(--card2);border-radius:99px;padding:7px 13px;font-size:14px;font-weight:800;flex:none;color:var(--a1)}
.pill.go{background:linear-gradient(135deg,var(--a1),var(--a2));color:#06121c}
.kv{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.kv:first-of-type{border-top:0}
.kv b{font-weight:800}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.rt{min-width:0}
.rt b{display:block;font-size:15px;font-weight:700}
.rt small{display:block;font-size:12.5px;color:var(--t3);margin-top:2px;line-height:1.35}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.acts button{background:var(--card2);border-radius:16px;padding:13px 11px;text-align:left;transition:transform .15s}
.acts button:active{transform:scale(.97)}
.acts button em{font-style:normal;font-size:19px;display:block;margin-bottom:5px}
.acts button b{display:block;font-size:14.5px;font-weight:800}
.acts button small{display:block;font-size:11.5px;color:var(--t3);margin-top:2px;line-height:1.3}
.goal{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.goal:first-of-type{border-top:0}
.goal .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:var(--card2);flex:none}
.goal.on .ic{background:linear-gradient(135deg,rgba(var(--ar),.35),rgba(var(--ar),.12));box-shadow:0 0 0 1px rgba(var(--ar),.3)}
.goal .nm{flex:1}
.goal .nm b{display:block;font-size:15px;font-weight:700}
.goal .nm small{display:block;font-size:12.5px;color:var(--t3);margin-top:1px}
.goal .tick{font-size:13px;font-weight:800;color:var(--a1);flex:none}
.goal.off{opacity:.5}
</style>
</head>
<body>
<div id="bg"><i></i><i></i></div>
<header id="top">
 <div class="t1">
  <button id="meBtn" data-act="settings"><b><span id="meName">You</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-2.9-1.2l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.7 1.7 0 0 0 3 14.1H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.6 9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.7 1.7 0 0 0 9.9 4.6V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 2.9 1.2l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0 1.4 2.9H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></b><span id="sub">-</span></button>
  <div class="st" style="text-align:right"><i id="hLab">In the bank</i><b id="hMoney">-</b></div>
 </div>
 <div class="bars">
  <div class="bar"><i>Health</i><u><s id="bHealth" style="background:linear-gradient(90deg,#30d158,#7cf0a0)"></s></u><b id="vHealth">-</b></div>
  <div class="bar"><i>Happy</i><u><s id="bHappy" style="background:linear-gradient(90deg,#ffd60a,#ffa800)"></s></u><b id="vHappy">-</b></div>

<script>
/* ================= LIFE SIMULATOR ENGINE ================= */
let L=null;                         /* the life */
const E={feed(){},ask(){},year(){},died(){},toast(){},unlock(){}};
let seed=1;
function srand(s){seed=s>>>0||1}
function rnd(){seed^=seed<<13;seed>>>=0;seed^=seed>>17;seed^=seed<<5;seed>>>=0;return seed/4294967296}
const ri=(a,b)=>a+Math.floor(rnd()*(b-a+1));
const pick=a=>a[Math.floor(rnd()*a.length)];
const cl=(v,a=0,b=100)=>Math.max(a,Math.min(b,v));
const chance=p=>rnd()<p;

const CITIES=[
 {id:'mel',n:'Melbourne',rent:430,pay:1.00,fun:1.10,e:'🚋',note:'Coffee, trams and four seasons in a day'},
 {id:'syd',n:'Sydney',rent:570,pay:1.14,fun:1.10,e:'🌉',note:'Beaches, harbour and brutal rent'},
 {id:'bne',n:'Brisbane',rent:390,pay:0.98,fun:1.00,e:'☀️',note:'Warm, flat and growing fast'},
 {id:'per',n:'Perth',rent:370,pay:1.06,fun:0.95,e:'🏖️',note:'Mining money, very long flights'},
 {id:'adl',n:'Adelaide',rent:330,pay:0.93,fun:0.95,e:'🍷',note:'Cheap, calm and good wine'},
 {id:'hbt',n:'Hobart',rent:340,pay:0.90,fun:0.92,e:'🏔️',note:'Cold, pretty and small'},
 {id:'ctry',n:'Country town',rent:250,pay:0.86,fun:0.80,e:'🌾',note:'Everyone knows your name'}];
const city=()=>CITIES.find(c=>c.id===L.city)||CITIES[0];

/* education: 0 none, 1 finished Year 12, 2 TAFE certificate, 3 degree, 4 masters */
const EDUN=['no schooling','Year 12','TAFE certificate','university degree','masters degree'];
/* fields of work. each step: title, yearly pay, min education, min smarts */
const FIELDS=[
 {id:'ware',n:'Warehouse',e:'📦',steps:[['Warehouse associate',58000,0,0],['Process assistant',72000,1,35],['Area manager',98000,1,50],['Operations manager',135000,2,60],['Site leader',185000,3,70]]},
 {id:'it',n:'IT support',e:'🖥️',steps:[['IT helpdesk (Tier 1)',66000,1,45],['IT support (Tier 2)',88000,2,55],['Systems administrator',115000,2,65],['Infrastructure engineer',145000,3,72],['IT manager',175000,3,78]]},
 {id:'retail',n:'Retail',e:'🛍️',steps:[['Checkout operator',48000,0,0],['Shift supervisor',62000,0,30],['Store manager',85000,1,45],['Regional manager',125000,2,58]]},
 {id:'hosp',n:'Hospitality',e:'🍔',steps:[['Kitchen hand',46000,0,0],['Barista',54000,0,25],['Chef',78000,2,45],['Head chef',105000,2,58],['Restaurant owner',140000,2,65]]},
 {id:'trade',n:'Trades',e:'🔧',steps:[['Apprentice sparky',42000,1,30],['Licensed electrician',95000,2,45],['Site foreman',128000,2,55],['Contractor (own business)',180000,2,62]]},
 {id:'nurse',n:'Health',e:'🩺',steps:[['Patient care assistant',62000,1,40],['Registered nurse',88000,3,60],['Nurse practitioner',128000,4,70],['Hospital director',190000,4,80]]},
 {id:'teach',n:'Teaching',e:'🎓',steps:[['Teacher aide',58000,1,40],['Primary teacher',82000,3,58],['Head of year',105000,3,66],['School principal',155000,4,75]]},
 {id:'fin',n:'Finance',e:'💼',steps:[['Bank teller',60000,1,45],['Accountant',92000,3,60],['Finance manager',140000,3,70],['Chief financial officer',260000,4,82]]},
 {id:'code',n:'Software',e:'👩‍💻',steps:[['Junior developer',82000,2,55],['Developer',120000,2,65],['Senior developer',160000,3,74],['Engineering lead',215000,3,82]]},
 {id:'art',n:'Creative',e:'🎨',steps:[['Barista slash artist',38000,0,0],['Graphic designer',68000,2,50],['Art director',105000,2,62],['Famous artist',260000,2,78]]},
 {id:'mine',n:'Mining',e:'⛏️',steps:[['FIFO trades assistant',98000,1,35],['Driller',135000,1,45],['Mine supervisor',175000,2,58],['Mine manager',240000,3,70]]},
 {id:'gig',n:'Gig work',e:'🛴',steps:[['Delivery rider',34000,0,0],['Rideshare driver',48000,0,20],['Small business owner',90000,0,45]]}];
const fieldOf=id=>FIELDS.find(f=>f.id===id);
function jobTitle(){if(!L.job)return null;const f=fieldOf(L.job.f);return f.steps[L.job.s][0]}
function jobPay(){if(!L.job)return 0;const f=fieldOf(L.job.f);return Math.round(f.steps[L.job.s][1]*city().pay*(1+L.job.raise))}
function netRate(p){return p<45000?.80:p<90000?.73:p<150000?.66:p<250000?.60:.56}
function nextStep(){if(!L.job)return null;const f=fieldOf(L.job.f);return f.steps[L.job.s+1]||null}
/* which jobs you could get right now */
function offers(){const out=[];for(const f of FIELDS)for(let i=f.steps.length-1;i>=0;i--){const s=f.steps[i];
  if(L.edu>=s[2]&&L.smarts>=s[3]&&(i===0||L.exp[f.id]>=i*3)){out.push({f:f.id,s:i,t:s[0],pay:Math.round(s[1]*city().pay),e:f.e,n:f.n});break}}
 return out.filter(o=>!L.job||o.f!==L.job.f||o.s!==L.job.s)}

const NAMES_F=['Ava','Mia','Zoe','Chloe','Ruby','Isla','Grace','Maya','Hannah','Lily','Sienna','Ella','Priya','Aroha','Mei','Sophie','Tahlia','Nina'];
const NAMES_M=['Jack','Liam','Noah','Jake','Tom','Hamish','Dylan','Ethan','Arjun','Koa','Marco','Sam','Ben','Tyler','Hugo','Leo','Ravi','Nate'];
const SURN=['Nguyen','Smith','Patel','Kelly','Chen','Brown','Singh','Rossi','Taylor','Wong','Murphy','Jones','Lee','Costa','Walker','Ahmed','Novak','Hall'];
const rawname=g=>g==='f'?pick(NAMES_F):g==='m'?pick(NAMES_M):pick(rnd()<.5?NAMES_F:NAMES_M);
function fname(g){const used=new Set();if(typeof L==='object'&&L){used.add(L.name);if(L.partner)used.add(L.partner.name);(L.people||[]).forEach(p=>used.add(p.name))}
 for(let i=0;i<40;i++){const n=rawname(g);if(!used.has(n))return n}return rawname(g)}
const TRAITS=['kind','funny','quiet','ambitious','messy','sporty','clever','dramatic','loyal','stubborn','generous','anxious'];

function newPerson(rel,g,age){return{id:++L.pid,rel,g,name:fname(g),sur:L.sur,age,bond:ri(55,85),trait:pick(TRAITS),alive:true,job:null}}

function newLife(o){srand(o.seed||((Date.now()^(Math.random()*1e9))>>>0));
 L={v:1,seed,name:o.name||'Alex',sur:o.sur||pick(SURN),g:o.g||'f',city:o.city||'mel',age:0,year:new Date().getFullYear(),year0:new Date().getFullYear(),
  health:ri(72,96),smarts:ri(35,80),looks:ri(30,85),happy:ri(70,90),money:0,debt:0,
  edu:0,uni:null,gpa:0,job:null,exp:{},fit:0,crime:0,fame:0,
  partner:null,married:false,people:[],pid:0,kids:0,
  assets:[],feed:[],done:{},stats:{jobs:0,raises:0,fired:0,dates:0,kids:0,moves:0,crimes:0,peak:0,best:0},
  flags:{},dead:false,cause:'',alive:true,pending:[]};
 FIELDS.forEach(f=>L.exp[f.id]=0);
 /* family */
 const mum=newPerson('Mum','f',ri(22,38)),dad=newPerson('Dad','m',ri(23,42));
 mum.job=pick(FIELDS).n;dad.job=pick(FIELDS).n;
 L.people.push(mum,dad);
 if(chance(.55))L.people.push(newPerson('Sibling',rnd()<.5?'f':'m',ri(0,6)));
 const wealth=rnd();L.flags.rich=wealth>.9;L.flags.poor=wealth<.25;
 L.money=L.flags.rich?ri(2000,6000):L.flags.poor?0:ri(100,900);
 say('🎉','You were born in '+city().n+' to '+mum.name+' and '+dad.name+'.','big');
 if(L.flags.rich)say('💎','Your family is well off. Private school is on the table.');
 if(L.flags.poor)say('🫙','Money is tight at home. You learn to make things stretch.');
 return L}

function tidy(){L.health=Math.round(cl(L.health));L.smarts=Math.round(cl(L.smarts));L.looks=Math.round(cl(L.looks));L.happy=Math.round(cl(L.happy));L.money=Math.round(L.money);L.debt=Math.round(L.debt);if(L.partner)L.partner.bond=cl(L.partner.bond);if(L.money<0){L.debt+=-L.money;L.money=0}}
function say(e,t,k=''){L.feed.push({age:L.age,e,t,k});if(L.feed.length>700)L.feed.shift();E.feed()}
const PR={baby:'Baby',kid:'Kid',teen:'Teen',adult:'Adult',old:'Older'};
function stage(){const a=L.age;return a<5?'baby':a<13?'kid':a<18?'teen':a<65?'adult':'old'}

/* ---------- yearly events ---------- */
const EV=[
/* id, weight, when()->bool, build()->{e,t,choices?} */
 {id:'bully',w:3,when:()=>L.age>=7&&L.age<=16,go(){return{e:'😠',t:'A kid at school keeps picking on you.',c:[
   ['Stand up to them',()=>{if(chance(.6)){L.happy+=6;return'You push back and they leave you alone.'}L.health-=8;L.happy-=4;return'It turns into a fight and you come off worse.'}],
   ['Tell a teacher',()=>{if(chance(.7)){L.happy+=3;return'The school steps in and it stops.'}L.happy-=5;return'Nothing changes and it drags on.'}],
   ['Keep your head down',()=>{L.happy-=6;return'You get through it, but it wears you down.'}]]}}},
 {id:'sport',w:3,when:()=>L.age>=8&&L.age<=22,go(){const s=pick(['footy','netball','cricket','soccer','swimming']);return{e:'🏅',t:'The school is picking a '+s+' team.',c:[
   ['Try out',()=>{if(L.health>60&&chance(.6)){L.health+=5;L.happy+=7;L.fit+=1;return'You make the team and love it.'}L.happy-=3;return'You miss out, but you had a go.'}],
   ['Not interested',()=>{L.smarts+=2;return'You spend the time reading instead.'}]]}}},

  else say('🚪','You left school without finishing Year 12.','bad')}
 if(L.uni){L.uni.yrs--;const fee=L.uni.kind===2?4000:L.uni.kind===3?12000:18000;L.money-=fee;

 /* work */
 if(L.job){const f=fieldOf(L.job.f);L.job.yrs++;L.exp[L.job.f]=(L.exp[L.job.f]||0)+1;

  else if(chance(.04)){say('📦','Your role was made redundant.','bad');L.job=null;L.stats.fired++;L.happy=cl(L.happy-12)}
  L.happy=cl(L.happy+(L.job?(L.job.perf>70?2:-1):0));
 } else if(L.age>=18&&L.age<65&&!L.uni){L.money-=0;if(L.age>21)L.happy=cl(L.happy-4);

 else if(L.age>=20&&L.age<70&&chance(.18+L.looks/400)){const g=rnd()<.5?'f':'m';const n=fname(g);startPartner(n,g,L.age+ri(-5,5));

  parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-5*spread,r:3+Math.random()*4,c:cols[i%4],rot:Math.random()*6,vr:(Math.random()-.5)*.4,life:1,sq:Math.random()<.5})}

function errText(e){
 const c=(e&&e.code)||'',m=(e&&e.message)||'';
 const T={'auth/invalid-credential':'Email or password is wrong.','auth/invalid-login-credentials':'Email or password is wrong.','auth/wrong-password':'Email or password is wrong.','auth/user-not-found':'No account with that email. Tap Create account.',

  'auth/operation-not-allowed':'Email sign-in is not switched on in Firebase.','auth/unauthorized-domain':'This website is not on the Firebase authorized domains list.',
  'permission-denied':'The cloud refused the save. The Firestore rules need the saves block.','auth/missing-email':'Enter your email address first.'};
 if(T[c])return T[c];
 if(/dynamically imported module|Failed to fetch|Importing a module|NetworkError|Load failed/i.test(m))return 'Could not reach the sign-in service. Check your connection.';
 return 'Something went wrong ('+(c||m||'unknown')+').';
}

async function cloudPush(){
 if(!SY.user||!FB||SY.conflict)return;
 save();if(!UPD){lastB='';save()}clearTimeout(SY.t);SY.t=0;
 const at=UPD,data=lastB,uid=SY.user.uid;

  await FB.fs.setDoc(FB.fs.doc(FB.db,'saves',uid,'games',CG.id),{data,upd:at,sum:sumPlain(JSON.parse(data)),email:SY.user.email||''});
  if(SY.user&&SY.user.uid===uid){setMeta(at);SY.empty=false;if(!SY.t)setSync('ok')}
 }catch(e){setSync(navigator.onLine===false||(e&&e.code==='unavailable')?'offline':'err',errText(e))}

function useSave(o,upd,msg){
 const body=JSON.stringify(Object.assign({},o,{upd}));
 try{localStorage.setItem(SKEY,body);sessionStorage.setItem(CG.id+'.toast',msg)}catch(e){toast('Could not save on this phone (storage full?)','bad');return false}
 wiping=true;setTimeout(()=>location.reload(),60);return true;
}
function cloudTake(d){
 let o=null;try{o=JSON.parse(d.data)}catch(e){}
 if(!o||!CG.ok(o)){setSync('err','account save looks damaged');return}
 setMeta(d.upd||0);SY.conflict=null;useSave(o,d.upd||0,'Game loaded from your account');
}
async function cloudPull(){
 if(!SY.user||!FB||SY.pulling)return;SY.pulling=true;SY.lastPull=Date.now();setSync('loading');
 try{
  const uid=SY.user.uid,snap=await FB.fs.getDoc(FB.fs.doc(FB.db,'saves',uid,'games',CG.id));
  if(!SY.user||SY.user.uid!==uid)return;
  save();const loc=UPD,m=syncMeta(),same=m.uid===uid,local=JSON.parse(lastB||'null');
  if(!snap.exists()){SY.pulling=false;if(CG.has(local))await cloudPush();else{SY.empty=true;setMeta(loc);setSync('ok')}return}
  const d=snap.data(),cu=d.upd||0;let cp=null;try{cp=JSON.parse(d.data)}catch(e){}
  SY.empty=false;
  if(cu===loc){setMeta(cu);setSync('ok')}
  else if(same&&m.at===loc)cloudTake(d);                    /* only the account changed */
  else if(same&&m.at===cu){SY.pulling=false;await cloudPush()} /* only this phone changed */
  else if(!CG.has(local))cloudTake(d);
  else if(!CG.has(cp)){SY.pulling=false;await cloudPush()}
  else{SY.conflict={d,cp,lp:local};setSync('conflict');conflictModal()}
 }catch(e){setSync(navigator.onLine===false||(e&&e.code==='unavailable')?'offline':'err',errText(e))}
 finally{SY.pulling=false}
}
function cloudUser(u){if(u)cloudPull();else{SY.conflict=null;SY.empty=false;setSync('off')}acRefresh();refreshSettings()}
function refreshSettings(){const a=$('acSub');if(!a)return;const c=a.closest('.card');if(c)c.outerHTML=cloudCard()}
function cloudBoot(){
 addEventListener('online',()=>{if(SY.user&&!SY.conflict&&(SY.t||SY.state==='offline'||SY.state==='err'))cloudPush()});
 document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='hidden'){if(SY.t)cloudPush()}
  else if(SY.user&&!SY.conflict&&Date.now()-SY.lastPull>30000&&!SY.t)cloudPull();
 });
 addEventListener('pagehide',()=>{if(SY.t)cloudPush()});
 let msg='';try{msg=sessionStorage.getItem(CG.id+'.toast')||'';sessionStorage.removeItem(CG.id+'.toast')}catch(e){}
 if(msg)setTimeout(()=>toast(msg,'good'),500);
 const known=[SYNC_KEY,'l2quest_sync','fct.sync','lsim.sync'].some(k=>{try{return JSON.parse(localStorage.getItem(k)||'{}').uid}catch(e){return false}});
 if(known)fbLoad().catch(e=>setSync('offline',errText(e)));
}
function conflictModal(){if(!SY.conflict)return;const c=SY.conflict;
 modal('<div class="big">☁️</div><h2>Two saved games</h2><p>Your account and this phone both have a game. Which one do you want to keep? The other one is replaced.</p>'+
  '<div class="acbox" style="text-align:left"><div class="aclbl">On your account</div>'+CG.sum(c.cp)+'<small>Saved '+when(c.d.upd)+'</small></div>'+
  '<div class="acbox" style="text-align:left;margin-bottom:14px"><div class="aclbl">On this phone</div>'+CG.sum(c.lp)+'<small>Saved '+when(UPD)+'</small></div>'+
  '<button class="btn" id="cfC">Keep account game</button><button class="btn ghost" id="cfL">Keep this phone\'s game</button>',
  m=>{m.querySelector('#cfC').onclick=()=>{closeModal();cloudTake(c.d)};
   m.querySelector('#cfL').onclick=()=>{closeModal();SY.conflict=null;cloudPush().then(()=>{if(SY.state==='ok')toast('Account updated with this phone\'s game','good')})}})}
const when=t=>t?new Date(t).toLocaleString([],{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'}):'a while ago';

/* ---------- settings card ---------- */
function cloudCard(){return '<div class="card"><h3>Account and backup<span>'+(SY.user?'Signed in':'')+'</span></h3><div class="acsub" id="acSub">'+acctLine()+'</div>'+
 '<div class="acrow"><button class="btn ghost" data-act="acct">'+(SY.user?'Account':'Sign in')+'</button><button class="btn ghost" data-act="backup">Backup code</button></div></div>'}

/* ---------- account sheet ---------- */
let acFrom='';
const _closeSheet=closeSheet;
closeSheet=function(){_closeSheet();const o=$('ob');if(o)o.style.visibility=''};
$('scrim').onclick=()=>closeSheet();
function sheetUp(r,from){acFrom=from||acFrom;const o=$('ob');if(o)o.style.visibility='hidden';openSheet(r)}
A.acct=el=>sheetUp(acctR,el&&el.dataset.from||(sheetR===acctR||sheetR===bkR?acFrom:'set'));
A.acBack=()=>{if(acFrom==='ob')closeSheet();else A.settings()};
function acctR(){
 let h=CG.head('Account');
 if(SY.user&&SY.conflict){
  h+='<div class="card"><p class="acp">Your account and this phone both have a game. Choose which one to keep.</p><button class="btn" data-act="acConf" style="margin-top:12px">Choose</button></div>';
 }else if(SY.user){
  h+='<div class="card"><div class="aclbl">Signed in as</div><b style="font-size:16px;word-break:break-all">'+esc(SY.user.email||'')+'</b><div class="acsub" id="acStat" style="margin-top:4px">'+syncText()+'</div>'+
   (SY.empty?'<p class="acp" style="margin-top:8px">Your account has no '+CG.title+' game yet. Start one and it saves to your account by itself.</p>':'')+
   '<p class="acp" style="margin-top:8px">Your game saves to your account while you play. Sign in with the same email on another phone or computer to carry on there.</p>'+
   '<div class="acrow"><button class="btn ghost" data-act="acSync">Sync now</button><button class="btn danger" data-act="acOut">Sign out</button></div></div>';
 }else if(!SY.ready&&FBP){
  h+='<div class="card"><p class="acp">Connecting...</p></div>';
 }else{
  h+='<div class="card"><p class="acp">Sign in to keep your game safe online and play it on any device. Already have an IT Support Quest account? Use the same email and password.</p>'+
   '<input class="inp acin" id="acEmail" type="email" inputmode="email" autocomplete="username" autocapitalize="off" spellcheck="false" placeholder="Email">'+
   '<input class="inp acin" id="acPass" type="password" autocomplete="current-password" placeholder="Password (6 or more characters)">'+
   '<div class="acmsg" id="acMsg"></div>'+
   '<div class="acrow"><button class="btn" data-act="acIn">Sign in</button><button class="btn ghost" data-act="acUp">Create account</button></div>'+
   '<button class="btn ghost" data-act="acForgot" style="margin-top:10px">Forgot password?</button></div>';
 }
 h+='<button class="btn ghost" data-act="backup">Backup code instead</button>';
 if(acFrom!=='ob')h+='<button class="btn ghost" data-act="acBack">Back to settings</button>';
 if(!FBP)setTimeout(()=>fbLoad().then(()=>acRefresh()).catch(e=>{const m=$('acMsg');if(m)m.textContent=errText(e)}),0);
 return h;
}
/* the game redraws open sheets now and then; keep typed text safe and leave the backup sheet alone */
acctR.static=true;
const _refreshSheet=refreshSheet;
refreshSheet=function(){if(sheetR===acctR)return acRefresh();if(sheetR===bkR)return;_refreshSheet()};
function acRefresh(){if(sheetR!==acctR||!$('shB'))return;const e=$('acEmail'),p=$('acPass'),m=$('acMsg');const ev=e&&e.value,pv=p&&p.value,mv=m&&m.textContent,mc=m&&m.className;
 _refreshSheet();const e2=$('acEmail'),p2=$('acPass'),m2=$('acMsg');if(e2&&ev)e2.value=ev;if(p2&&pv)p2.value=pv;if(m2&&mv){m2.textContent=mv;m2.className=mc}}
A.acIn=()=>acDo('in');A.acUp=()=>acDo('up');A.acForgot=()=>acDo('reset');
A.acConf=()=>conflictModal();
A.acSync=()=>{haptic();if(SY.t)cloudPush();else cloudPull()};
A.acOut=async()=>{haptic();if(SY.t)await cloudPush();try{localStorage.removeItem(SYNC_KEY)}catch(e){}await FB.au.signOut(FB.auth);toast('Signed out. Your game stays on this phone.')};
async function acDo(kind){
 const em=$('acEmail').value.trim(),pw=$('acPass').value,msg=$('acMsg'),btns=$('shB').querySelectorAll('.btn');
 msg.className='acmsg';msg.textContent='';
 if(!/^\S+@\S+\.\S+$/.test(em)){msg.textContent='Enter your email address.';return}
 if(kind!=='reset'&&pw.length<6){msg.textContent='Password needs at least 6 characters.';return}
 btns.forEach(b=>b.disabled=true);msg.className='acmsg ok';msg.textContent=kind==='reset'?'Sending...':'Please wait...';haptic();
 try{
  await fbLoad();
  if(kind==='reset'){await FB.au.sendPasswordResetEmail(FB.auth,em);msg.textContent='Reset email sent. Check your inbox and spam folder.';btns.forEach(b=>b.disabled=false);return}
  if(kind==='up')await FB.au.createUserWithEmailAndPassword(FB.auth,em,pw);else await FB.au.signInWithEmailAndPassword(FB.auth,em,pw);
  toast(kind==='up'?'Account created':'Signed in','good');acRefresh();
 }catch(e){const m2=$('acMsg');if(m2){m2.className='acmsg';m2.textContent=errText(e)}$('shB')&&$('shB').querySelectorAll('.btn').forEach(b=>b.disabled=false)}
}

/* ---------- backup code ---------- */
function b64(u){let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)}
function unb64(t){const s=atob(t),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u}
const zip=(u,C)=>new Response(new Blob([u]).stream().pipeThrough(new C('gzip'))).arrayBuffer().then(b=>new Uint8Array(b));
async function packCode(){save();const u=new TextEncoder().encode('{"upd":'+UPD+','+lastB.slice(1));let z=null;
 if(window.CompressionStream)try{z=await zip(u,CompressionStream)}catch(e){}
 return CG.pre+'.'+(z?'z':'j')+'.'+b64(z||u)}
async function unpackCode(t){t=String(t||'').replace(/\s+/g,'');const m=t.match(/^([A-Z]{2,5}1)\.([zj])\.([A-Za-z0-9+/=]+)$/);
 if(!m)return{err:'That does not look like a backup code. It should start with '+CG.pre+'.'};
 if(m[1]!==CG.pre)return{err:'That code is for a different game. '+CG.title+' codes start with '+CG.pre+'.'};
 try{let u=unb64(m[3]);if(m[2]==='z'){if(!window.DecompressionStream)return{err:'This browser is too old to open that code. Update iOS and try again.'};u=await zip(u,DecompressionStream)}
  const o=JSON.parse(new TextDecoder().decode(u));if(!o||typeof o!=='object'||!o.S||!CG.ok(o))throw 0;return{o}}
 catch(e){return{err:'That code is incomplete or damaged. Copy the whole code and try again.'}}}
A.backup=el=>{SY.code='';sheetUp(bkR,el&&el.dataset.from||(sheetR===acctR?acFrom:'set'));packCode().then(c=>{SY.code=c;SY.codeAt=Date.now();const t=$('acCode');if(t){t.value=c;$('bkSize').textContent='About '+Math.max(1,Math.round(c.length/1024))+' KB'}
 const b=$('bkCopy');if(b)b.disabled=false;const s=$('bkShare');if(s)s.disabled=false})};
bkR.static=true;
function bkR(){const has=CG.has(JSON.parse(lastB||'null'));
 return CG.head('Backup code')+
 (has?'<div class="card"><h3>Save this game<span id="bkSize"></span></h3><p class="acp">Copy this code and keep it somewhere safe, like Notes or an email to yourself. Paste it back here on any phone to get this game back.</p>'+
  '<textarea class="accode" id="acCode" readonly placeholder="Making your code..."></textarea>'+
  '<div class="acrow"><button class="btn" data-act="bkCopy" id="bkCopy" disabled>Copy code</button>'+(navigator.share?'<button class="btn ghost" data-act="bkShare" id="bkShare" disabled>Share</button>':'')+'</div></div>':
  '<div class="card"><p class="acp">There is no game on this phone to back up yet.</p></div>')+
 '<div class="card"><h3>Restore a game</h3><p class="acp">Paste your '+CG.title+' backup code (it starts with '+CG.pre+'.).'+(has?' This replaces the game on this phone.':'')+'</p>'+
  '<textarea class="accode" id="acPaste" placeholder="Paste your code here" autocapitalize="off" autocomplete="off" spellcheck="false"></textarea><div class="acmsg" id="bkMsg"></div>'+
  '<button class="btn ghost" data-act="bkRestore" style="margin-top:6px">Restore</button></div>'+
 '<button class="btn ghost" data-act="acct">'+(SY.user?'Account':'Sign in instead')+'</button>'+
 (acFrom!=='ob'?'<button class="btn ghost" data-act="acBack">Back to settings</button>':'')}
A.bkCopy=()=>{const c=SY.code;if(!c)return;haptic();const ok=()=>{toast('Backup code copied','good');sfx('good')};
 const fall=()=>{const t=$('acCode');if(!t)return;t.removeAttribute('readonly');t.focus();t.select();t.setSelectionRange(0,c.length);let done=false;try{done=document.execCommand('copy')}catch(e){}t.setAttribute('readonly','');
  if(done)ok();else toast('Press and hold the code, then Select All and Copy')};
 if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(c).then(ok,fall);else fall()};
A.bkShare=()=>{if(!SY.code)return;haptic();navigator.share({title:CG.title+' backup',text:SY.code}).catch(()=>{})};
A.bkRestore=async el=>{const t=$('acPaste'),m=$('bkMsg');if(!t||!m)return;m.className='acmsg';m.textContent='';
 if(!t.value.trim()){m.textContent='Paste your backup code first.';return}
 el.disabled=true;const r=await unpackCode(t.value);el.disabled=false;
 if(r.err){m.textContent=r.err;sfx('bad');return}
 const go=()=>{if(useSave(r.o,Date.now(),'Game restored from your backup code'))m.className='acmsg ok',m.textContent='Restoring...'};
 if(!CG.has(JSON.parse(lastB||'null')))return go();
 modal('<div class="big">♻️</div><h2>Replace this game?</h2><p>The game on this phone will be swapped for the one in the code.</p><div class="acbox" style="text-align:left;margin-bottom:14px"><div class="aclbl">In the code</div>'+CG.sum(r.o)+'</div>'+
  '<button class="btn" id="rsY">Yes, restore it</button><button class="btn ghost" id="rsN">Cancel</button>',
  mm=>{mm.querySelector('#rsY').onclick=()=>{closeModal();go()};mm.querySelector('#rsN').onclick=closeModal})};

/* ================= GOALS ================= */
R.goals=()=>{const p=$('p-goals');const done=Object.keys(L.done).length;
 let h='<div class="hdr"><div><h1>Goals</h1><div class="s">'+done+' of '+UNLOCKS.length+' done this life</div></div>'+
  '<button class="ibtn" data-act="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="3.4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4"/></svg></button></div>';
 h+='<div class="card"><h3>Life goals<span>no rewards, just bragging</span></h3>'+
  UNLOCKS.map(u=>'<div class="goal '+(L.done[u[0]]?'on':'off')+'"><div class="ic">'+u[1]+'</div><div class="nm"><b>'+u[2]+'</b><small>'+u[3]+'</small></div>'+
   (L.done[u[0]]?'<div class="tick">age '+L.done[u[0]]+'</div>':'')+'</div>').join('')+'</div>';
 const st=L.stats||{};
 h+='<div class="card"><h3>This life so far</h3>'+
  [['Age',L.age],['City',city().n],['Education',EDUN[L.edu]],['Job',jobTitle()||'none'],['Best pay',st.peak?fmF(st.peak):'never worked'],
   ['Jobs held',st.jobs||0],['Raises',st.raises||0],['Let go',st.fired||0],['Partners',st.dates||0],['Children',L.kids||0],
   ['Moves',st.moves||0],['Net worth',fmF(netWorth())]].map(r=>'<div class="kv"><span>'+r[0]+'</span><b>'+esc(String(r[1]))+'</b></div>').join('')+'</div>';
 h+='<div class="card"><h3>All your lives</h3>'+
  [['Lives played',S.lives||0],['Longest life',S.bestAge?S.bestAge+' years':'-'],['Richest life',S.bestWorth?fmF(S.bestWorth):'-']]
   .map(r=>'<div class="kv"><span>'+r[0]+'</span><b>'+esc(String(r[1]))+'</b></div>').join('')+'</div>';
 p.innerHTML=h};

/* ================= ACTIONS SHEET (Life tab) ================= */
const DOACTS=[
 ['study','📚','Study hard','$400 · smarts up',()=>L.age>=6],
 ['gym','🏋️','Train at the gym','$700 · health and looks up',()=>L.age>=12],
 ['doctor','🩺','See the doctor','$250 · health up',()=>L.age>=1],
 ['party','🎉','Big night out','$300 · happy up, health down',()=>L.age>=16],
 ['beauty','💅','Makeover','$2,500 · looks up',()=>L.age>=14],
 ['work','🔥','Extra hours at work','Rating up, happy down',()=>!!L.job]];
A.doSheet=()=>{openSheet(()=>'<div class="sh-t"><h2>What do you do?</h2></div>'+
 '<div class="card"><div class="acts">'+DOACTS.filter(a=>a[4]()).map(a=>
  '<button data-act="do" data-k="'+a[0]+'"><em>'+a[1]+'</em><b>'+a[2]+'</b><small>'+a[3]+'</small></button>').join('')+'</div>'+
 '<p class="t2" style="font-size:12.5px;margin-top:11px;line-height:1.4">Do as many as you can afford each year. These take effect straight away.</p></div>')};
A.do=el=>{const r=act(el.dataset.k);tidy();const bad=r.indexOf('cannot')>=0||r.indexOf('do not have')>=0;say(bad?'🚫':'✅',r,bad?'bad':'');sfx(bad?'bad':'good');haptic();
 toast(r,bad?'bad':'good');checkUnlocks();R.life();hud();save();refreshSheet();runQueue()};

/* ================= SETTINGS ================= */
A.settings=()=>{openSheet(()=>{
 const tg=(k,t,s)=>'<div class="row"><div class="rt"><b>'+t+'</b><small>'+s+'</small></div><button class="tgl'+(S[k]?' on':'')+'" data-act="tgl" data-k="'+k+'"><i></i></button></div>';
 return'<div class="sh-t"><h2>Settings</h2></div>'+
 '<div class="card">'+tg('sound','Sound effects','Clicks, cash and alerts')+tg('haptics','Haptics','Taps on supported iPhones')+'</div>'+
 cloudCard()+
 '<div class="card"><h3>This life</h3><div class="kv"><span>Name</span><b>'+esc(L.name+' '+L.sur)+'</b></div>'+
  '<div class="kv"><span>Born</span><b>'+L.year0+'</b></div><div class="kv"><span>City</span><b>'+city().n+'</b></div></div>'+
 '<button class="btn ghost" data-act="howto">How to play</button>'+
 '<button class="btn danger" data-act="restart" style="margin-top:10px">Start a new life</button>'+
 '<p class="t2" style="font-size:12px;text-align:center;margin-top:14px">Life Simulator v1.1 · '+saveWhere()+'</p>'})};
A.tgl=el=>{const k=el.dataset.k;S[k]=!S[k];haptic();if(k==='sound'&&S.sound)sfx('tap');save();refreshSheet()};
A.howto=()=>{closeSheet();setTimeout(tutorial,200)};
A.restart=()=>{modal('<div class="big">🔄</div><h2>Start a new life?</h2><p>This life ends here and is not saved.</p>'+
 '<button class="btn danger" id="mYes">Start again</button><button class="btn ghost" id="mNo">Keep playing</button>',m=>{
 m.querySelector('#mYes').onclick=()=>{closeModal();closeSheet();setTimeout(()=>A.newLife(),260)};
 m.querySelector('#mNo').onclick=()=>closeModal()})};
A.newLife=()=>{L=null;save();onboard()};

/* ================= ONBOARDING ================= */
function onboard(){if($('ob'))return;const w=document.createElement('div');w.id='ob';
 const nm=S.lastName||'';
 w.innerHTML='<img class="logo" src="icon-192.png" alt=""><h1>Life <span class="grad">Simulator</span></h1>'+
  '<p>Live a whole life from the first word to the last. Pick a city, build a career, find someone, and see how it ends.</p>'+
  '<label for="obN">Your name</label><input class="inp" id="obN" maxlength="14" value="'+esc(nm)+'" placeholder="Alex" autocomplete="off">'+
  '<div class="chips" id="obG">'+[['f','👩 Girl'],['m','👨 Boy']].map(g=>'<button class="chip'+(S.lastG===g[0]?' on':'')+'" data-g="'+g[0]+'">'+g[1]+'</button>').join('')+'</div>'+
  '<label style="margin-top:14px">Where you are born</label><div class="chips" id="obC">'+CITIES.map((c,i)=>'<button class="chip'+(i===0?' on':'')+'" data-c="'+c.id+'">'+c.e+' '+c.n+'</button>').join('')+'</div>'+
  '<div id="obNote" class="t2" style="font-size:13px;margin:10px 2px 0;line-height:1.4"></div>'+
  '<button class="btn" id="obGo" style="margin-top:18px">Be born</button><button class="btn ghost" data-act="acct" data-from="ob">I already have a game</button>';
 document.body.appendChild(w);
 let g=S.lastG||'f',cid=CITIES[0].id;
 const note=()=>{const c=CITIES.find(x=>x.id===cid);$('obNote').textContent=c.note+'. Rent about $'+c.rent+' a week.'};
 note();
 w.querySelector('#obG').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;g=b.dataset.g;
  w.querySelectorAll('#obG .chip').forEach(x=>x.classList.toggle('on',x===b));haptic()};
 w.querySelector('#obC').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;cid=b.dataset.c;
  w.querySelectorAll('#obC .chip').forEach(x=>x.classList.toggle('on',x===b));note();haptic()};
 w.querySelector('#obGo').onclick=()=>{const inp=$('obN');const n=(inp.value.trim()||(g==='f'?'Alex':'Alex')).slice(0,14);
  S.lastName=n;S.lastG=g;newLife({name:n,g,city:cid});evQueue=[];unlockQ=[];deathPending=false;
  sfx('born');haptic(2);confetti(null,innerHeight*.4,80);
  w.classList.add('out');setTimeout(()=>w.remove(),460);
  go('life');R.life();hud();save();feedBottom();
  setTimeout(()=>{if(!S.tut)tutorial()},400)}}

/* ================= TUTORIAL ================= */
const TUT=[
 ['👶','This is your life','You start as a baby in an Australian city. Tap Age up and a year goes by: things happen, and some of them need a decision from you.'],
 ['📊','Four things to watch','Health, Happy, Smarts and Looks sit at the top. Smarts decide which careers will take you. Health decides how long you last.'],
 ['🎓','School, then work','At 18 you choose: university, TAFE or straight to work. Better qualifications open better jobs in the Work tab, and jobs have a ladder to climb.'],
 ['💞','People matter','Partners, parents and kids all have a bond that fades if you ignore them. Visit them in the People tab. Marriage and kids cost money and add happiness.'],
 ['🎯','Nothing is on rails','Every life is different. Chase money, chase happiness or chase a world record age. Twelve life goals are waiting in the Goals tab.']];
function tutorial(){let i=0;
 const draw=m=>{const t=TUT[i];m.innerHTML='<div class="big">'+t[0]+'</div><div class="dots">'+TUT.map((x,j)=>'<i class="'+(j===i?'on':'')+'"></i>').join('')+'</div><h2>'+t[1]+'</h2><p>'+t[2]+'</p>'+
  '<button class="btn" id="tN">'+(i===TUT.length-1?'Start living':'Next')+'</button>'+(i?'<button class="btn ghost" id="tB">Back</button>':'<button class="btn ghost" id="tS">Skip</button>');
  m.querySelector('#tN').onclick=()=>{haptic();sfx('tap');if(i<TUT.length-1){i++;draw(m)}else done()};
  const b=m.querySelector('#tB');if(b)b.onclick=()=>{i--;draw(m)};const s=m.querySelector('#tS');if(s)s.onclick=done};
 const done=()=>{S.tut=true;save();closeModal()};
 modal('',draw)}

/* ================= BOOT ================= */
window.addEventListener('error',e=>{(window.__e=window.__e||[]).push(String(e.message))});
load();
if(L){hud();R.life();feedBottom();if(L.dead)toast('This life has ended. Tap below to live another.','')}else onboard();
addEventListener('pagehide',save);document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
cloudBoot();
if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});

</script>
